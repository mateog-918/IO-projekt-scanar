swagger: "2.0"
info:
  title: "SCANAR API - System kontroli dostępu"
  description: "API dla systemu weryfikacji dostępu pracowników (QR + rozpoznawanie twarzy)"
  version: "1.0.0"
  contact:
    name: "SCANAR Team"

host: "localhost:5000"
basePath: "/api"
schemes:
  - "http"

tags:
  - name: "Authentication"
    description: "Autentykacja i autoryzacja admina"
  - name: "Verification"
    description: "Endpointy weryfikacji dostępu"
  - name: "Employees"
    description: "Zarządzanie pracownikami"
  - name: "Logging"
    description: "Rejestrowanie i pobieranie dziennika zdarzeń weryfikacji"

paths:
  /auth/login:
    post:
      tags:
        - "Authentication"
      summary: "Logowanie admina"
      description: "Logowanie do panelu administracyjnego. Credentials: admin/admin123"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Dane logowania"
          required: true
          schema:
            type: "object"
            required:
              - username
              - password
            properties:
              username:
                type: "string"
                example: "admin"
                description: "Nazwa użytkownika (domyślnie: admin)"
              password:
                type: "string"
                example: "admin123"
                description: "Hasło (domyślnie: admin123)"
      responses:
        200:
          description: "Logowanie udane"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              message:
                type: "string"
                example: "Login successful"
              user:
                type: "object"
                properties:
                  username:
                    type: "string"
                    example: "admin"
        400:
          description: "Brak danych"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: false
              message:
                type: "string"
                example: "Username and password are required"
        401:
          description: "Nieprawidłowe dane logowania"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: false
              message:
                type: "string"
                example: "Invalid credentials"
  
  /auth/logout:
    post:
      tags:
        - "Authentication"
      summary: "Wylogowanie admina"
      description: "Wylogowanie z panelu administracyjnego (czyści sesję)"
      produces:
        - "application/json"
      responses:
        200:
          description: "Wylogowanie udane"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              message:
                type: "string"
                example: "Logged out successfully"
  
  /auth/status:
    get:
      tags:
        - "Authentication"
      summary: "Sprawdzenie statusu logowania"
      description: "Sprawdza czy użytkownik jest zalogowany"
      produces:
        - "application/json"
      responses:
        200:
          description: "Status sesji"
          schema:
            type: "object"
            properties:
              logged_in:
                type: "boolean"
                example: true
              username:
                type: "string"
                example: "admin"
                description: "Tylko gdy logged_in = true"

  /verification/qr:
    post:
      tags:
        - "Verification"
      summary: "Weryfikacja QR kodu"
      description: "Skanuje QR kod i zwraca dane pracownika"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Dane QR kodu do weryfikacji"
          required: true
          schema:
            type: "object"
            required:
              - qr_data
            properties:
              qr_data:
                type: "string"
                example: "a1b2c3d4e5f6..."
                description: "Hash QR kodu pracownika"
      responses:
        200:
          description: "QR kod zweryfikowany poprawnie"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              message:
                type: "string"
                example: "Witaj, Jan Kowalski"
              employee:
                type: "object"
                properties:
                  id:
                    type: "integer"
                    example: 1
                  name:
                    type: "string"
                    example: "Jan Kowalski"
                  position:
                    type: "string"
                    example: "Engineer"
                  department:
                    type: "string"
                    example: "IT"
                  qr_code_hash:
                    type: "string"
                  is_active:
                    type: "boolean"
                  created_at:
                    type: "string"
                    format: "date-time"
        400:
          description: "Brak danych QR"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: false
              message:
                type: "string"
                example: "Brak danych QR kodu"
              employee:
                type: "null"
        404:
          description: "Nie znaleziono pracownika"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: false
              message:
                type: "string"
                example: "Nie znaleziono pracownika dla podanego QR kodu"
              employee:
                type: "null"
        500:
          description: "Błąd serwera"

  /manage_employees/:
    post:
      tags:
        - "Employees"
      summary: "Dodaj nowego pracownika"
      description: "Tworzy nowego pracownika bez QR kodu (QR kod można wygenerować osobno endpointem POST /manage_employees/{employee_id}/qr)"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Dane nowego pracownika"
          required: true
          schema:
            type: "object"
            required:
              - name
            properties:
              name:
                type: "string"
                example: "Jan Kowalski"
                description: "Imię i nazwisko pracownika"
              position:
                type: "string"
                example: "Engineer"
                description: "Stanowisko"
              department:
                type: "string"
                example: "IT"
                description: "Dział"
      responses:
        201:
          description: "Pracownik utworzony (bez QR kodu)"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              employee:
                type: "object"
                properties:
                  id:
                    type: "integer"
                  name:
                    type: "string"
                  position:
                    type: "string"
                  department:
                    type: "string"
                  qr_code_hash:
                    type: "string"
                    example: ""
                    description: "Pusty ciąg - QR kod nie został jeszcze wygenerowany"
                  is_active:
                    type: "boolean"
                  created_at:
                    type: "string"
        400:
          description: "Błąd walidacji"
        500:
          description: "Błąd serwera"
    
    get:
      tags:
        - "Employees"
      summary: "Pobierz listę pracowników"
      description: "Zwraca listę pracowników z opcjonalnym filtrem aktywności (domyślnie tylko aktywni)"
      produces:
        - "application/json"
      parameters:
        - in: "query"
          name: "active"
          type: "string"
          required: false
          description: "Filtr aktywności: 'true' (tylko aktywni - domyślnie), 'false' (tylko nieaktywni), 'all' (wszyscy)"
          enum: ["true", "false", "all"]
          default: "true"
      responses:
        200:
          description: "Lista pracowników"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              employees:
                type: "array"
                items:
                  type: "object"
                  properties:
                    id:
                      type: "integer"
                    name:
                      type: "string"
                    position:
                      type: "string"
                    department:
                      type: "string"
                    qr_code_hash:
                      type: "string"
                    is_active:
                      type: "boolean"
                    created_at:
                      type: "string"
        500:
          description: "Błąd serwera"

  /manage_employees/{employee_id}/qr:
    post:
      tags:
        - "Employees"
      summary: "Wygeneruj QR kod dla pracownika"
      description: "Generuje unikalny QR kod dla pracownika i zapisuje go w bazie oraz jako plik PNG"
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "employee_id"
          description: "ID pracownika"
          required: true
          type: "integer"
      responses:
        200:
          description: "QR kod wygenerowany"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              message:
                type: "string"
                example: "QR kod wygenerowany"
              employee:
                type: "object"
                properties:
                  id:
                    type: "integer"
                  name:
                    type: "string"
                  position:
                    type: "string"
                  department:
                    type: "string"
                  qr_code_hash:
                    type: "string"
                    example: "a1b2c3d4e5f6..."
                  is_active:
                    type: "boolean"
                  created_at:
                    type: "string"
              qr_code_hash:
                type: "string"
                example: "a1b2c3d4e5f6..."
                description: "Wygenerowany hash QR kodu"
        404:
          description: "Nie znaleziono pracownika"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: false
              message:
                type: "string"
                example: "Nie znaleziono pracownika"
        500:
          description: "Błąd serwera"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: false
              message:
                type: "string"

  /manage_employees/{employee_id}/faces:
    post:
      tags:
        - "Employees"
      summary: "Dodaj zdjęcie twarzy pracownika"
      description: "Dodaje zdjęcie twarzy i przechowuje embedding (max 5 zdjęć na pracownika). Uses fixed matching tolerance of 0.6 for any comparisons."
      consumes:
        - "multipart/form-data"
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "employee_id"
          description: "ID pracownika"
          required: true
          type: "integer"
        - in: "formData"
          name: "image"
          type: "file"
          required: true
          description: "Plik obrazu z twarzą"
      responses:
        200:
          description: "Obraz dodany"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              message:
                type: "string"
                example: "Image added"
              image_path:
                type: "string"
                example: "static/face_images/1_abcd1234.jpg"
              count:
                type: "integer"
                example: 1
        400:
          description: "Błąd walidacji (np. brak obrazu, brak twarzy, limit osiągnięty)"
        404:
          description: "Nie znaleziono pracownika"
        500:
          description: "Błąd serwera"

  /manage_employees/{employee_id}:
    get:
      tags:
        - "Employees"
      summary: "Pobierz dane pracownika"
      description: "Zwraca szczegóły pracownika po ID"
      parameters:
        - in: "path"
          name: "employee_id"
          required: true
          type: "integer"
          description: "ID pracownika"
      responses:
        200:
          description: "Pracownik znaleziony"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              employee:
                type: "object"
        404:
          description: "Nie znaleziono pracownika"
    
    put:
      tags:
        - "Employees"
      summary: "Edytuj dane pracownika"
      description: "Aktualizuje dane pracownika (name, position, department)"
      parameters:
        - in: "path"
          name: "employee_id"
          required: true
          type: "integer"
          description: "ID pracownika"
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              name:
                type: "string"
                example: "Jan Nowak"
              position:
                type: "string"
                example: "Senior Engineer"
              department:
                type: "string"
                example: "IT"
      responses:
        200:
          description: "Dane zaktualizowane"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              message:
                type: "string"
                example: "Dane pracownika zaktualizowane"
              employee:
                type: "object"
        400:
          description: "Brak danych do aktualizacji"
        404:
          description: "Nie znaleziono pracownika"
    
    delete:
      tags:
        - "Employees"
      summary: "Usuń pracownika z bazy (hard delete)"
      description: "UWAGA: Całkowite usunięcie pracownika, plików i historii. Nieodwracalne! Wymaga parametru confirm=true"
      parameters:
        - in: "path"
          name: "employee_id"
          required: true
          type: "integer"
          description: "ID pracownika"
        - in: "query"
          name: "confirm"
          required: true
          type: "string"
          description: "Potwierdzenie (musi być 'true')"
          enum: ["true"]
      responses:
        200:
          description: "Pracownik usunięty"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              message:
                type: "string"
                example: "Pracownik Jan Kowalski został całkowicie usunięty"
        400:
          description: "Brak potwierdzenia (confirm=true)"
        404:
          description: "Nie znaleziono pracownika"

  /manage_employees/{employee_id}/deactivate:
    put:
      tags:
        - "Employees"
      summary: "Dezaktywuj pracownika (soft delete)"
      description: "Ustawia is_active=false. Pracownik znika z list, ale dane pozostają w bazie"
      parameters:
        - in: "path"
          name: "employee_id"
          required: true
          type: "integer"
          description: "ID pracownika"
      responses:
        200:
          description: "Pracownik dezaktywowany"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              message:
                type: "string"
                example: "Pracownik Jan Kowalski został dezaktywowany"
              employee:
                type: "object"
        400:
          description: "Pracownik jest już dezaktywowany"
        404:
          description: "Nie znaleziono pracownika"

  /manage_employees/{employee_id}/activate:
    put:
      tags:
        - "Employees"
      summary: "Reaktywuj pracownika"
      description: "Ustawia is_active=true. Przywraca pracownika do listy aktywnych"
      parameters:
        - in: "path"
          name: "employee_id"
          required: true
          type: "integer"
          description: "ID pracownika"
      responses:
        200:
          description: "Pracownik reaktywowany"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              message:
                type: "string"
                example: "Pracownik Jan Kowalski został reaktywowany"
              employee:
                type: "object"
        400:
          description: "Pracownik jest już aktywny"
        404:
          description: "Nie znaleziono pracownika"

  /manage_employees/{employee_id}/faces/{face_index}:
    delete:
      tags:
        - "Employees"
      summary: "Usuń konkretną twarz pracownika"
      description: "Usuwa encoding i plik zdjęcia dla wybranej twarzy (index 1-5)"
      parameters:
        - in: "path"
          name: "employee_id"
          required: true
          type: "integer"
          description: "ID pracownika"
        - in: "path"
          name: "face_index"
          required: true
          type: "integer"
          description: "Numer twarzy (1-5)"
          minimum: 1
          maximum: 5
      responses:
        200:
          description: "Twarz usunięta"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              message:
                type: "string"
                example: "Twarz 1 została usunięta"
              remaining_faces:
                type: "integer"
                example: 2
                description: "Liczba pozostałych twarzy"
        400:
          description: "Nieprawidłowy indeks twarzy"
        404:
          description: "Nie znaleziono pracownika"

  /verification/employees/{employee_id}/match:
    post:
      tags:
        - "Verification"
      summary: "Porównaj przesłane zdjęcie z encodigami pracownika"
      description: "Przesyła obraz i zwraca czy dopasowano do jednego z zapisanych encodigów. Uses a fixed matching tolerance of 0.6 (not configurable via the API)."
      consumes:
        - "multipart/form-data"
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "employee_id"
          required: true
          type: "integer"
          description: "ID pracownika"
        - in: "formData"
          name: "image"
          type: "file"
          required: true
          description: "Plik obrazu z twarzą"
      responses:
        200:
          description: "Zwraca wynik dopasowania"
          schema:
            type: "object"
            properties:
              match:
                type: "boolean"
                example: true
        400:
          description: "Brak obrazu lub brak twarzy w obrazie"
        404:
          description: "Nie znaleziono pracownika"
        500:
          description: "Błąd serwera"

  /logs/:
    get:
      tags:
        - "Logging"
      summary: "Pobierz wszystkie logi"
      description: "Zwraca listę wszystkich logów z opcjonalną paginacją"
      produces:
        - "application/json"
      parameters:
        - in: "query"
          name: "limit"
          type: "integer"
          required: false
          default: 100
          description: "Liczba wyników na stronę"
        - in: "query"
          name: "offset"
          type: "integer"
          required: false
          default: 0
          description: "Liczba wyników do pominięcia"
      responses:
        200:
          description: "Lista logów"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              total:
                type: "integer"
                example: 500
              limit:
                type: "integer"
                example: 100
              offset:
                type: "integer"
                example: 0
              logs:
                type: "array"
                items:
                  $ref: "#/definitions/EventLog"
        500:
          description: "Błąd serwera"

  /logs/type/{event_type}:
    get:
      tags:
        - "Logging"
      summary: "Pobierz logi według typu zdarzenia"
      description: "Filtruje logi po konkretnym typie zdarzenia (np. INVALID_QR, VERIFICATION_SUCCESS)"
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "event_type"
          type: "string"
          required: true
          description: "Typ zdarzenia"
          enum: ["INVALID_QR", "FACE_MISMATCH", "VERIFICATION_SUCCESS", "QR_SCANNED", "FACE_SCANNED"]
        - in: "query"
          name: "limit"
          type: "integer"
          required: false
          default: 100
        - in: "query"
          name: "offset"
          type: "integer"
          required: false
          default: 0
      responses:
        200:
          description: "Lista logów danego typu"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              event_type:
                type: "string"
                example: "VERIFICATION_SUCCESS"
              total:
                type: "integer"
              limit:
                type: "integer"
              offset:
                type: "integer"
              logs:
                type: "array"
                items:
                  $ref: "#/definitions/EventLog"
        500:
          description: "Błąd serwera"

  /logs/employee/{employee_id}:
    get:
      tags:
        - "Logging"
      summary: "Pobierz logi dla konkretnego pracownika"
      description: "Zwraca wszystkie logi związane z danym pracownikiem"
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "employee_id"
          type: "integer"
          required: true
          description: "ID pracownika"
        - in: "query"
          name: "limit"
          type: "integer"
          required: false
          default: 100
        - in: "query"
          name: "offset"
          type: "integer"
          required: false
          default: 0
      responses:
        200:
          description: "Lista logów pracownika"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              employee_id:
                type: "integer"
                example: 5
              total:
                type: "integer"
              limit:
                type: "integer"
              offset:
                type: "integer"
              logs:
                type: "array"
                items:
                  $ref: "#/definitions/EventLog"
        500:
          description: "Błąd serwera"

  /logs/date-range:
    get:
      tags:
        - "Logging"
      summary: "Pobierz logi w zakresie dat"
      description: "Filtruje logi według przedziału czasowego (wymaga start_date i end_date w formacie ISO)"
      produces:
        - "application/json"
      parameters:
        - in: "query"
          name: "start_date"
          type: "string"
          required: true
          description: "Data początkowa (ISO format: 2024-01-15T00:00:00)"
          example: "2024-01-15T00:00:00"
        - in: "query"
          name: "end_date"
          type: "string"
          required: true
          description: "Data końcowa (ISO format: 2024-01-15T23:59:59)"
          example: "2024-01-15T23:59:59"
        - in: "query"
          name: "limit"
          type: "integer"
          required: false
          default: 100
        - in: "query"
          name: "offset"
          type: "integer"
          required: false
          default: 0
      responses:
        200:
          description: "Lista logów w podanym zakresie"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              start_date:
                type: "string"
              end_date:
                type: "string"
              total:
                type: "integer"
              limit:
                type: "integer"
              offset:
                type: "integer"
              logs:
                type: "array"
                items:
                  $ref: "#/definitions/EventLog"
        400:
          description: "Błąd walidacji (brak parametrów lub nieprawidłowy format daty)"
        500:
          description: "Błąd serwera"

  /logs/statistics:
    get:
      tags:
        - "Logging"
      summary: "Pobierz statystyki zdarzeń"
      description: "Zwraca zagregowane statystyki - liczba każdego typu zdarzenia"
      produces:
        - "application/json"
      responses:
        200:
          description: "Statystyki zdarzeń"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              statistics:
                type: "object"
                additionalProperties:
                  type: "integer"
                example:
                  VERIFICATION_SUCCESS: 150
                  FACE_MISMATCH: 12
                  INVALID_QR: 5
                  QR_SCANNED: 145
                  FACE_SCANNED: 140
        500:
          description: "Błąd serwera"

  /logs/image/{log_id}:
    get:
      tags:
        - "Logging"
      summary: "Pobierz zdjęcie z konkretnego logu"
      description: "Zwraca fizyczny plik obrazu powiązany z zdarzeniem (jeśli istnieje)"
      produces:
        - "image/png"
      parameters:
        - in: "path"
          name: "log_id"
          type: "integer"
          required: true
          description: "ID logu"
      responses:
        200:
          description: "Obraz PNG"
          schema:
            type: "file"
        404:
          description: "Nie znaleziono logu lub brak powiązanego obrazu"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: false
              error:
                type: "string"
                example: "Log entry not found"
        500:
          description: "Błąd serwera"

  /logs/event-types:
    get:
      tags:
        - "Logging"
      summary: "Pobierz wszystkie typy zdarzeń"
      description: "Zwraca listę wszystkich możliwych typów zdarzeń używanych w systemie"
      produces:
        - "application/json"
      responses:
        200:
          description: "Lista typów zdarzeń"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              event_types:
                type: "array"
                items:
                  type: "string"
                example: ["INVALID_QR", "FACE_MISMATCH", "VERIFICATION_SUCCESS", "QR_SCANNED", "FACE_SCANNED"]
        500:
          description: "Błąd serwera"

  /verification/save_qr:
    post:
      tags:
        - "Verification"
      summary: "Zapisz wygenerowany kod QR pracownika"
      description: "Odbiera obraz kodu QR w formacie Base64 oraz nazwę pracownika. Dekoduje dane binarne i zapisuje je jako plik .png w dedykowanym folderze na serwerze. Jeśli plik o danej nazwie już istnieje, zostaje nadpisany."
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          required: true
          description: "Obiekt JSON zawierający dane obrazu i identyfikację pracownika"
          schema:
            type: "object"
            properties:
              image:
                type: "string"
                description: "Obraz w formacie Base64 (ciąg znaków zaczynający się od 'data:image/png;base64,')"
                example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
              name:
                type: "string"
                description: "Pełne imię i nazwisko pracownika (wykorzystywane jako nazwa pliku)"
                example: "Jan Kowalski"
      responses:
        200:
          description: "Pomyślnie zapisano plik na serwerze"
          schema:
            type: "object"
            properties:
              message:
                type: "string"
                example: "Saved to ./QRcode/Jan Kowalski.png"
        400:
          description: "Błąd walidacji - brak pola 'image' lub 'name' w żądaniu"
        500:
          description: "Wewnętrzny błąd serwera (np. błąd dekodowania Base64 lub brak uprawnień do zapisu pliku)"

  /logs/:
    get:
      tags:
        - "Logging"
      summary: "Pobierz wszystkie dzienniki zdarzeń"
      description: "Zwraca listę wszystkich zarejestrowanych zdarzeń weryfikacji z opcjonalnym podziałem na strony"
      produces:
        - "application/json"
      parameters:
        - in: "query"
          name: "limit"
          type: "integer"
          required: false
          default: 100
          description: "Liczba wyników na stronę"
        - in: "query"
          name: "offset"
          type: "integer"
          required: false
          default: 0
          description: "Liczba wyników do pominięcia"
      responses:
        200:
          description: "Lista dzienników zdarzeń"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              total:
                type: "integer"
                example: 150
              limit:
                type: "integer"
                example: 100
              offset:
                type: "integer"
                example: 0
              logs:
                type: "array"
                items:
                  $ref: "#/definitions/EventLog"
        500:
          description: "Błąd serwera"

  /logs/type/{event_type}:
    get:
      tags:
        - "Logging"
      summary: "Pobierz dzienniki przefiltrowane po typie zdarzenia"
      description: "Zwraca zdarzenia określonego typu (INVALID_QR, FACE_MISMATCH, VERIFICATION_SUCCESS, QR_SCANNED, FACE_SCANNED)"
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "event_type"
          type: "string"
          required: true
          description: "Typ zdarzenia do filtrowania"
          enum: ["INVALID_QR", "FACE_MISMATCH", "VERIFICATION_SUCCESS", "QR_SCANNED", "FACE_SCANNED"]
        - in: "query"
          name: "limit"
          type: "integer"
          required: false
          default: 100
          description: "Liczba wyników na stronę"
        - in: "query"
          name: "offset"
          type: "integer"
          required: false
          default: 0
          description: "Liczba wyników do pominięcia"
      responses:
        200:
          description: "Zdarzenia filtrowane po typie"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              event_type:
                type: "string"
                example: "FACE_MISMATCH"
              total:
                type: "integer"
                example: 8
              limit:
                type: "integer"
              offset:
                type: "integer"
              logs:
                type: "array"
                items:
                  $ref: "#/definitions/EventLog"
        500:
          description: "Błąd serwera"

  /logs/employee/{employee_id}:
    get:
      tags:
        - "Logging"
      summary: "Pobierz dzienniki dla konkretnego pracownika"
      description: "Zwraca wszystkie zdarzenia weryfikacji dla wybranego pracownika"
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "employee_id"
          type: "integer"
          required: true
          description: "ID pracownika"
        - in: "query"
          name: "limit"
          type: "integer"
          required: false
          default: 100
          description: "Liczba wyników na stronę"
        - in: "query"
          name: "offset"
          type: "integer"
          required: false
          default: 0
          description: "Liczba wyników do pominięcia"
      responses:
        200:
          description: "Zdarzenia dla pracownika"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              employee_id:
                type: "integer"
                example: 5
              total:
                type: "integer"
                example: 45
              limit:
                type: "integer"
              offset:
                type: "integer"
              logs:
                type: "array"
                items:
                  $ref: "#/definitions/EventLog"
        500:
          description: "Błąd serwera"

  /logs/date-range:
    get:
      tags:
        - "Logging"
      summary: "Pobierz dzienniki z zakresu dat"
      description: "Zwraca zdarzenia z okresu między start_date a end_date"
      produces:
        - "application/json"
      parameters:
        - in: "query"
          name: "start_date"
          type: "string"
          format: "date-time"
          required: true
          description: "Data początkowa (format ISO: 2024-01-15T00:00:00)"
          example: "2024-01-15T00:00:00"
        - in: "query"
          name: "end_date"
          type: "string"
          format: "date-time"
          required: true
          description: "Data końcowa (format ISO: 2024-01-15T23:59:59)"
          example: "2024-01-15T23:59:59"
        - in: "query"
          name: "limit"
          type: "integer"
          required: false
          default: 100
          description: "Liczba wyników na stronę"
        - in: "query"
          name: "offset"
          type: "integer"
          required: false
          default: 0
          description: "Liczba wyników do pominięcia"
      responses:
        200:
          description: "Zdarzenia z zakresu dat"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              start_date:
                type: "string"
                example: "2024-01-15T00:00:00"
              end_date:
                type: "string"
                example: "2024-01-15T23:59:59"
              total:
                type: "integer"
                example: 35
              logs:
                type: "array"
                items:
                  $ref: "#/definitions/EventLog"
        400:
          description: "Brak lub nieprawidłowy format daty"
        500:
          description: "Błąd serwera"

  /logs/statistics:
    get:
      tags:
        - "Logging"
      summary: "Pobierz statystyki zdarzeń"
      description: "Zwraca liczbę zdarzeń pogrupowaną po typach"
      produces:
        - "application/json"
      responses:
        200:
          description: "Statystyki zdarzeń"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              statistics:
                type: "object"
                properties:
                  VERIFICATION_SUCCESS:
                    type: "integer"
                    example: 145
                  FACE_MISMATCH:
                    type: "integer"
                    example: 8
                  INVALID_QR:
                    type: "integer"
                    example: 12
                  QR_SCANNED:
                    type: "integer"
                    example: 200
                  FACE_SCANNED:
                    type: "integer"
                    example: 150
                  total:
                    type: "integer"
                    example: 515
        500:
          description: "Błąd serwera"

  /logs/event-types:
    get:
      tags:
        - "Logging"
      summary: "Pobierz dostępne typy zdarzeń"
      description: "Zwraca listę wszystkich możliwych typów zdarzeń w systemie"
      produces:
        - "application/json"
      responses:
        200:
          description: "Lista typów zdarzeń"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: true
              event_types:
                type: "array"
                items:
                  type: "string"
                  enum: ["INVALID_QR", "FACE_MISMATCH", "VERIFICATION_SUCCESS", "QR_SCANNED", "FACE_SCANNED"]
                example: ["INVALID_QR", "FACE_MISMATCH", "VERIFICATION_SUCCESS", "QR_SCANNED", "FACE_SCANNED"]
        500:
          description: "Błąd serwera"

  /logs/image/{log_id}:
    get:
      tags:
        - "Logging"
      summary: "Pobierz obraz powiązany ze zdarzeniem"
      description: "Zwraca plik PNG powiązany z danym zdarzeniem w dzienniku"
      produces:
        - "image/png"
      parameters:
        - in: "path"
          name: "log_id"
          type: "integer"
          required: true
          description: "ID wpisu w dzienniku (event_logs.id)"
      responses:
        200:
          description: "Obraz PNG"
          schema:
            type: "string"
            format: "binary"
        404:
          description: "Wpis w dzienniku nie znaleziony lub brak powiązanego obrazu"
          schema:
            type: "object"
            properties:
              success:
                type: "boolean"
                example: false
              error:
                type: "string"
                example: "No image associated with this log"
        500:
          description: "Błąd serwera"

definitions:
  Employee:
    type: "object"
    required:
      - id
      - name
    properties:
      id:
        type: "integer"
        description: "Unikalne ID pracownika"
        example: 1
      name:
        type: "string"
        description: "Imię i nazwisko pracownika"
        example: "Jan Kowalski"
      position:
        type: "string"
        description: "Stanowisko pracownika"
        example: "Engineer"
      department:
        type: "string"
        description: "Dział"
        example: "IT"
      qr_code_hash:
        type: "string"
        description: "Hash powiązany z wygenerowanym QR kodem"
      is_active:
        type: "boolean"
        description: "Czy konto pracownika jest aktywne"
      created_at:
        type: "string"
        format: "date-time"
        description: "Data utworzenia rekordu"
      face_image_paths:
        type: "array"
        description: "Lista ścieżek do zapisanych zdjęć twarzy (maksymalnie 5)"
        items:
          type: "string"
        example: ["static/face_images/1_a.jpg", "static/face_images/1_b.jpg"]
      face_encoding_count:
        type: "integer"
        description: "Liczba zapisanych wektorów twarzy (encodingów) dla pracownika"
        example: 2

  EventLog:
    type: "object"
    properties:
      id:
        type: "integer"
        description: "Unikalne ID zdarzenia"
        example: 101
      event_type:
        type: "string"
        description: "Typ zdarzenia"
        enum: ["INVALID_QR", "FACE_MISMATCH", "VERIFICATION_SUCCESS", "QR_SCANNED", "FACE_SCANNED"]
        example: "VERIFICATION_SUCCESS"
      employee_id:
        type: "integer"
        description: "ID pracownika (null dla zdarzeń INVALID_QR)"
        example: 5
      qr_code_hash:
        type: "string"
        description: "Hash QR kodu który był skanowany"
        example: "a1b2c3d4e5f6..."
      image_path:
        type: "string"
        description: "Ścieżka do zapisanego obrazu z kamery"
        example: "static/logs/VERIFICATION_SUCCESS/VERIFICATION_SUCCESS_5_20240115_143040_001.png"
      message:
        type: "string"
        description: "Dodatkowe informacje o zdarzeniu"
        example: "Successful verification for employee Jan Kowalski"
      timestamp:
        type: "string"
        format: "date-time"
        description: "Kiedy zdarzenie miało miejsce"
        example: "2024-01-15T14:30:40.789000"
      created_at:
        type: "string"
        format: "date-time"
        description: "Kiedy zdarzenie zostało zarejestrowane"
        example: "2024-01-15T14:30:40.890000"
      employee_name:
        type: "string"
        description: "Imię i nazwisko pracownika (null dla zdarzeń bez pracownika)"
        example: "Jan Kowalski"